[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-project"
version = "0.1.0"
description = "A LangGraph project with interactive frontend"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-openai",
    "langchain-core",
    "langsmith",
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "python-dotenv",
    "typing_extensions",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
start-server = "src.server:main"
